[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orders"
version = "0.1.0"
description = "Servicio de Orders con Arquitectura Limpia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
orders-cli = "orders.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["orders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = false